name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-ci.txt
      - name: Install pinned serving and verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-runtime.lock
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Correctness lint
        run: python -m ruff check .
      - name: Dependency advisory audit
        run: |
          python -m pip_audit --no-deps --disable-pip -r requirements-runtime-audit.txt
          python -m pip_audit --no-deps --disable-pip -r requirements-research-audit.txt
      - name: Unit and integration tests
        run: python -m pytest -q --junitxml=test-results.xml

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
      - name: TypeScript and production build
        run: npm run build

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned CPU-only image
        run: docker build --platform linux/amd64 --target runtime -t banglapsg-api:ci .
      - name: Check CPU installation and import serving modules
        run: docker run --rm banglapsg-api:ci python -c "import torch; assert torch.version.cuda is None; import backend.app; print('CPU serving imports OK')"
